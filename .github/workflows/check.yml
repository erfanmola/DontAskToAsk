name: Quality and build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
      - name: Verify committed Pages output
        run: |
          git status --short -- docs
          test -z "$(git status --porcelain -- docs)"
